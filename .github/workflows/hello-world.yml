name: Hello World Workflow
on: 
  workflow_dispatch:
env:
  VAR_ENV: workflow_variable
jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
      - name: variables
        run: echo ${{ github.ref }}
      - name: custom_variable
        run: echo ${{ env.VAR_ENV }}
  say-needs:
    needs: say-hello-inline-bash
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  say-multiple:
    needs: [say-hello-inline-bash, say-needs]
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  
